[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "OkadaJAX"
version = "0.2.1"
description = "JAX implementation of Okada's formulae for displacements and strains due to a point source or a rectangular fault"
readme = "README.md"
license = { file = "LICENSE" }
# Recent JAX releases need Python 3.10 or later.
requires-python = ">=3.10"
authors = [{ name = "Masayoshi Someya" }]
keywords = ["okada", "dislocation", "crustal deformation", "geodesy", "jax",
            "automatic differentiation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]

# The library itself imports nothing but jax.  The rest is used only by the
# example notebooks and the tests.
dependencies = ["jax"]

[project.optional-dependencies]
examples = ["numpy", "matplotlib", "seaborn", "pyproj", "optax", "numpyro", "cartopy"]
test = ["pytest", "numpy"]

[project.urls]
Repository = "https://github.com/msomeya1/OkadaJAX"

[tool.setuptools]
packages = ["OkadaJAX"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]       # lets `pytest` run from a checkout without installing
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
